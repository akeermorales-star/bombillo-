<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bombillo Multifuncional Inteligente · Despiece técnico</title>
<style>
:root{--ac:#4cc9f0;--mu:#8a97ab;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;color:#e8eef7;background:radial-gradient(ellipse at 50% 40%,#101a2b 0%,#070a10 55%,#030508 100%);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:absolute;inset:0}
canvas{display:block;touch-action:none;cursor:grab}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hd{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);pointer-events:none}
.hd h1{margin:0;font-size:15px;letter-spacing:.04em;font-weight:600}
.hd p{margin:3px 0 0;color:var(--ac);font-size:12px}
.hd small{display:block;margin-top:4px;color:var(--mu);font-size:11px}
#pg{position:absolute;left:0;top:0;height:3px;width:0;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.lb{position:absolute;width:176px;padding:6px 9px;background:rgba(10,15,24,.74);border:1px solid #243044;border-radius:8px;backdrop-filter:blur(6px);opacity:0;pointer-events:none}
.lb.m{border-color:var(--ac)}
.lb b{display:block;font-size:12px;color:#fff}
.lb span{color:var(--mu);font-size:11px}
#ui{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
button{background:rgba(16,24,38,.85);color:#e8eef7;border:1px solid #2a3850;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac);color:#fff}
@media(max-width:640px){.lb{width:120px}.lb span{font-size:10px}.hd small{display:none}}
</style></head><body>
<div id="stage"><svg id="sv"></svg><div id="pg"></div>
<div class="hd"><h1>BOMBILLO MULTIFUNCIONAL INTELIGENTE</h1><p id="cap"></p><small>Arrastra para rotar · rueda o ＋ / － para acercar</small></div>
<div id="ui"><button id="bPlay">▶ Reproducir</button><button id="bPause">⏸ Pausar</button><button id="bReset">⟲ Reiniciar</button><button id="bExp">Mostrar despiece</button><button id="bAsm">Ensamblar</button><button id="bRgb">Color RGB</button><button id="bZi">＋</button><button id="bZo">－</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),stage=$('#stage');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const W=()=>stage.clientWidth,H=()=>stage.clientHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.outputEncoding=THREE.sRGBEncoding;
stage.insertBefore(renderer.domElement,stage.firstChild);
const cv=renderer.domElement,scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);
scene.fog=new THREE.Fog(0x05070b,16,34);
// entorno para reflejos metálicos
const envS=new THREE.Scene();
envS.add(new THREE.Mesh(new THREE.SphereGeometry(20,16,16),new THREE.MeshBasicMaterial({color:0x0c111a,side:THREE.BackSide})));
[[0,9,0,0xffffff,12,12],[8,3,2,0xcfe8ff,3,8],[-8,2,-3,0xffd9f2,3,8],[0,2,-9,0xffffff,10,3]].forEach(([x,y,z,c,w,h])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envS.add(m)});
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(envS,.04).texture;
scene.add(new THREE.HemisphereLight(0x8fb4ff,0x0b0f16,.35));
const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(5,9,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:30});key.shadow.bias=-.0005;scene.add(key);
const rim=new THREE.PointLight(0x4cc9f0,.8,30);rim.position.set(-6,2,-6);scene.add(rim);
const fl=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:0x0b1018,roughness:.35,metalness:.6}));
fl.rotation.x=-Math.PI/2;fl.position.y=-4.4;fl.receiveShadow=true;scene.add(fl);

// materiales y utilidades
const M=(c,m,r,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},o));
const chrome=M(0xcfd6df,1,.18),steel=M(0x8e98a6,.9,.35),brass=M(0xc9a24a,1,.28),dark=M(0x14181f,.4,.5),white=M(0xeef1f5,.1,.4,{side:THREE.DoubleSide}),alu=M(0x2b313b,.85,.3),green=M(0x0f6b3a,.2,.55),copper=M(0xb8662f,.8,.4);
const ledMat=M(0x111111,.1,.4,{emissive:0xffffff,emissiveIntensity:0});
const dotMat=new THREE.MeshBasicMaterial({color:0x000000}),coreMat=M(0x111111,0,.5,{emissive:0xffffff,emissiveIntensity:0});
const mesh=(g,geo,mat,x=0,y=0,z=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m};
const cyl=(a,b,h,s=48,o=false)=>new THREE.CylinderGeometry(a,b,h,s,1,o);
const tor=(g,r,t,y,mat)=>{const m=mesh(g,new THREE.TorusGeometry(r,t,8,48),mat,0,y,0);m.rotation.x=Math.PI/2;return m};
const root=new THREE.Group();scene.add(root);const parts={};
// part(clave, y ensamblado, desplazamiento de despiece, retardo)
function part(k,y,dy,d){const g=new THREE.Group();g.position.y=y;g.userData={y,dy,d};root.add(g);parts[k]=g;return g}

// 1 · Difusor LED (centro de la pieza = 1.15)
let g=part('diff',1.15,2.25,0);
const glass=mesh(g,new THREE.SphereGeometry(.5,48,32),M(0xdfe9f5,0,.15,{transparent:true,opacity:.38,depthWrite:false}));
mesh(g,new THREE.SphereGeometry(.3,32,24),coreMat);
mesh(g,cyl(.34,.3,.1),white,0,-.45,0);
const ledLight=new THREE.PointLight(0xffffff,0,9);g.add(ledLight);
// 2 · Aspas multifuncionales (4) + buje
g=part('blades',.55,1.55,.05);
const spin=new THREE.Group();g.add(spin);
mesh(spin,cyl(.3,.3,.12),chrome);mesh(spin,cyl(.12,.12,.04),dark,0,.08,0);
const bshape=(x0,x1,w0,w1)=>{const s=new THREE.Shape();s.moveTo(x0,-w0);s.lineTo(x1,-w1);s.quadraticCurveTo(x1+w1*.9,0,x1,w1);s.lineTo(x0,w0);s.closePath();return s};
const bgeo=(s,d,y)=>{const o=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});o.rotateX(-Math.PI/2);o.translate(0,y,0);return o};
const frameG=bgeo(bshape(0,1.3,.17,.27),.06,0),ledG=bgeo(bshape(.12,1.2,.11,.2),.014,.058),dotG=new THREE.SphereGeometry(.03,10,8);
const hinges=[];
for(let i=0;i<4;i++){
  const pv=new THREE.Group();pv.rotation.y=i*Math.PI/2;spin.add(pv);
  mesh(pv,new THREE.BoxGeometry(.3,.05,.12),steel,.45,0,0);
  const hg=new THREE.Group();hg.position.x=.6;pv.add(hg);hinges.push(hg);
  const pin=mesh(hg,cyl(.04,.04,.16,16),chrome);pin.rotation.x=Math.PI/2;
  const bl=new THREE.Group();bl.rotation.x=.2;hg.add(bl);   // inclinación tipo ventilador
  mesh(bl,frameG,alu);mesh(bl,ledG,ledMat);                  // el LED forma parte del aspa
  for(let k=0;k<5;k++)mesh(bl,dotG,dotMat,.3+k*.2,.072,0);
}
// 3 · Motor
g=part('motor',.2,.8,.1);
mesh(g,cyl(.27,.27,.34),steel);mesh(g,cyl(.285,.285,.1),copper);
tor(g,.27,.02,.17,chrome);tor(g,.27,.02,-.17,chrome);
mesh(g,cyl(.04,.04,.3,16),chrome,0,.3,0);mesh(g,cyl(.34,.34,.03),alu,0,-.18,0);
// 4 · Cubierta con rejillas del parlante
g=part('ring',-.25,.45,.15);
mesh(g,cyl(.585,.585,.3,48,true),M(0x20262f,.6,.35,{side:THREE.DoubleSide}));
tor(g,.585,.015,.15,chrome);tor(g,.585,.015,-.15,chrome);
const slotM=M(0x020305,0,1);
for(let i=0;i<28;i++){const a=i/28*Math.PI*2,m=mesh(g,new THREE.BoxGeometry(.035,.2,.02),slotM,Math.cos(a)*.59,0,Math.sin(a)*.59);m.rotation.y=Math.PI/2-a}
// 5 · Parlante
g=part('spk',-.25,-.35,.2);
mesh(g,cyl(.36,.36,.18),dark);mesh(g,cyl(.2,.2,.1),steel,0,-.12,0);
mesh(g,cyl(.12,.3,.1,40,true),M(0x6b7280,.3,.6,{side:THREE.DoubleSide}),0,.08,0);
mesh(g,new THREE.SphereGeometry(.1,24,12,0,Math.PI*2,0,Math.PI/2),dark,0,.12,0);tor(g,.31,.02,.1,dark);
// 6 · Placa electrónica
g=part('pcb',-.6,-.8,.25);
mesh(g,cyl(.4,.4,.03),green);
for(let k=0;k<6;k++){const a=k*1.05,r=.15+(k%2)*.1;mesh(g,new THREE.BoxGeometry(.12,.03,.09),dark,Math.cos(a)*r,.03,Math.sin(a)*r)}
for(let k=0;k<8;k++){const a=k*.785+.2;mesh(g,cyl(.03,.03,.07,12),steel,Math.cos(a)*.32,.05,Math.sin(a)*.32)}
[0xff2a2a,0x2aff5a,0x2a6bff].forEach((c,k)=>{const a=k*2.1+.5;mesh(g,new THREE.BoxGeometry(.05,.03,.05),M(0x000000,0,.5,{emissive:c,emissiveIntensity:1.5}),Math.cos(a)*.27,.03,Math.sin(a)*.27)});
// 7 · Cuerpo central
g=part('body',-.4,-1.9,.3);
const o=[[.40,-.4],[.47,-.25],[.55,-.05],[.56,.4]],n=[[.52,.4],[.51,-.05],[.43,-.25],[.37,-.4]];
mesh(g,new THREE.LatheGeometry(o.concat(n).map(p=>new THREE.Vector2(p[0],p[1])),48),white);
// 8 · Base E27
g=part('base',-1.2,-2.4,.35);
mesh(g,cyl(.36,.36,.7),steel);for(let i=0;i<6;i++)tor(g,.37,.035,-.28+i*.12,chrome);
mesh(g,cyl(.45,.45,.1),dark,0,.4,0);mesh(g,cyl(.3,.3,.08),dark,0,-.39,0);mesh(g,cyl(.14,.14,.08),brass,0,-.45,0);
root.traverse(m=>{if(m.isMesh){m.castShadow=m.material!==glass.material;m.receiveShadow=true}});

// etiquetas técnicas
const L=[['diff','Difusor LED','Iluminación principal · color RGB','R',1,[.35,.2,.3]],
['blades','Aspas multifuncionales ×4','Ventilación e iluminación LED integrada','L',1,[.3,.07,0]],
['motor','Motor central','Mueve las cuatro aspas','R',1,[.27,.05,0]],
['ring','Cubierta con rejillas','Salida de audio del parlante','L',0,[.59,0,0]],
['spk','Parlante integrado','Módulo de audio','R',0,[.34,0,0]],
['pcb','Placa electrónica','Control y alimentación','L',0,[.38,.02,0]],
['body','Cuerpo central','Une y sostiene los componentes','R',0,[.52,0,0]],
['base','Base E27','Conexión eléctrica al portalámparas','L',1,[.4,0,0]]].map(a=>{
  const el=document.createElement('div');el.className='lb'+(a[4]?' m':'');el.innerHTML='<b>'+a[1]+'</b><span>'+a[2]+'</span>';stage.appendChild(el);
  const ns='http://www.w3.org/2000/svg',ln=document.createElementNS(ns,'line'),dt=document.createElementNS(ns,'circle');
  ln.setAttribute('stroke',a[4]?'#4cc9f0':'#6f819c');ln.setAttribute('stroke-width','1');dt.setAttribute('r','3');dt.setAttribute('fill',a[4]?'#4cc9f0':'#6f819c');
  $('#sv').append(ln,dt);return{k:a[0],side:a[3],el,ln,dt,a:new THREE.Vector3(...a[5])}});

// estado y línea de tiempo (42 s)
const DUR=42,S={t:0,play:true,manual:false,e:0,f:0,deploy:[0,0,0,0],led:0,sat:.15,hue:.55,spin:0,speed:0,rot:0},T={e:0,speed:5};
let hueOff=0,rgbF=0;
const caps=['Escena 1 · Presentación del producto','Escena 2 · Despliegue de las cuatro aspas','Escena 3 · Despiece técnico','Escena 4 · Funcionamiento: ventilación + iluminación LED','Escena 5 · Ensamblaje'];
function timeline(t){
  S.rot=sm(t/6)*Math.PI*2;
  S.deploy=[0,1,2,3].map(i=>sm((t-6.5-i*.5)/3.5));
  S.e=sm((t-13)/6)*(1-sm((t-33)/9));
  S.f=sm((t-23)/2.5)*(1-sm((t-33)/2.5));
  S.led=.7*sm((t-10)/3)+.3*sm((t-24)/2);
  S.sat=.15+.85*sm((t-24)/2);
  S.hue=.55+Math.max(0,t-24)*.07;
  S.speed=10*sm((t-23)/2.5)*(1-sm((t-33)/9)*.5);
  $('#cap').textContent=caps[t<6?0:t<13?1:t<23?2:t<33?3:4];
}
function step(dt){
  if(!S.manual){S.t=Math.min(DUR,S.t+dt);timeline(S.t)}
  else{const k=1-Math.exp(-3*dt);S.e+=(T.e-S.e)*k;S.f-=S.f*k;S.deploy=S.deploy.map(d=>d+(1-d)*k);S.led+=(1-S.led)*k;S.sat+=(1-S.sat)*k;S.speed+=(T.speed-S.speed)*k;S.hue+=dt*.07;$('#cap').textContent='Modo manual · '+(T.e?'vista de despiece':'producto ensamblado')}
  S.spin+=S.speed*dt;
}
function apply(time){
  root.rotation.y=S.rot;root.position.y=Math.sin(time*1.2)*.04*(1-S.e);
  for(const k in parts){const g=parts[k],u=g.userData;g.position.y=u.y+u.dy*sm((S.e-u.d)/.65)}
  hinges.forEach((h,i)=>h.rotation.z=(1-S.deploy[i])*Math.PI/2);
  spin.rotation.y=S.spin;
  const c=new THREE.Color().setHSL(((S.hue+hueOff)%1+1)%1,Math.max(S.sat,rgbF),.55);
  ledMat.emissive.copy(c);ledMat.emissiveIntensity=S.led*1.8;
  dotMat.color.copy(c).multiplyScalar(.2+.8*S.led);
  coreMat.emissive.copy(c);coreMat.emissiveIntensity=S.led*1.6;
  ledLight.color.copy(c);ledLight.intensity=S.led*2.2;
}
// cámara orbital propia
let az=.55,el=.2,zoom=1,drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*.008;el=clamp(el+(e.clientY-drag.y)*.006,-.2,1.2);drag.x=e.clientX;drag.y=e.clientY});
addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*.001),.45,1.8)},{passive:false});
function camera(dt){
  const asp=W()/H();
  if(!drag&&(S.manual||S.t>6.5))az+=dt*(.1+.1*S.f);
  const dist=(6.2+6*S.e)*(1-.42*S.f)*zoom*(asp<1?1+(1-asp)*.8:1),ty=.1*S.e*(1-S.f)+1.9*S.f;
  cam.position.set(Math.sin(az)*Math.cos(el)*dist,ty+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,ty,0);
}
function labels(){
  scene.updateMatrixWorld();const w=W(),h=H(),v=new THREE.Vector3(),lw=L[0].el.offsetWidth,eA=sm((S.e-.55)/.4),dm=S.deploy.reduce((a,b)=>a+b,0)/4;
  const it=L.map(l=>{v.copy(l.a);parts[l.k].localToWorld(v);v.project(cam);return{l,x:(v.x*.5+.5)*w,y:(-v.y*.5+.5)*h,al:l.k==='blades'?Math.max(eA,dm*dm):eA}});
  ['L','R'].forEach(sd=>{const a=it.filter(i=>i.l.side===sd).sort((p,q)=>p.y-q.y);
    a.forEach((i,n)=>{i.ty=clamp(i.y,60,h-90);if(n&&i.ty<a[n-1].ty+54)i.ty=a[n-1].ty+54});
    a.forEach(i=>{const {l}=i,lx=sd==='L'?18:w-18-lw,ex=sd==='L'?lx+lw:lx;
      l.el.style.left=lx+'px';l.el.style.top=(i.ty-22)+'px';l.el.style.opacity=i.al;
      l.ln.setAttribute('x1',i.x);l.ln.setAttribute('y1',i.y);l.ln.setAttribute('x2',ex);l.ln.setAttribute('y2',i.ty);
      l.dt.setAttribute('cx',i.x);l.dt.setAttribute('cy',i.y);l.ln.style.opacity=l.dt.style.opacity=i.al})});
}
function resize(){renderer.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  step(S.play?dt:0);apply(now/1000);camera(dt);labels();
  $('#pg').style.width=(S.t/DUR*100)+'%';renderer.render(scene,cam)})(last);
// controles
$('#bPlay').onclick=()=>{if(S.manual||S.t>=DUR){S.manual=false;S.t=0}S.play=true};
$('#bPause').onclick=()=>S.play=false;
$('#bReset').onclick=()=>{S.manual=false;S.t=0;S.play=true;S.spin=0;hueOff=0;rgbF=0};
$('#bExp').onclick=()=>{S.manual=true;T.e=1};
$('#bAsm').onclick=()=>{S.manual=true;T.e=0};
$('#bRgb').onclick=()=>{hueOff+=.17;rgbF=1};
$('#bZi').onclick=()=>zoom=clamp(zoom*.8,.45,1.8);
$('#bZo').onclick=()=>zoom=clamp(zoom*1.25,.45,1.8);
</script></body></html>
